# Thanks to @derberg for the original code:
# https://github.com/derberg/manage-files-in-multiple-repositories?tab=readme-ov-file
#
# Replicates governance markdown files and community-health workflows from this
# .github repo to every other repository in the reshaprio organization.

name: Global workflow to replicate files in all repositories

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "*.md"
      - "!README.md"
      - "!SUBPROJECTS.md"
  workflow_dispatch:
    inputs:
      repo_name:
        description: |
          You can specify the repository's name where files should be pushed manually, as long as workflow settings do not ignore the repository.
          If you do not specify the exact repository name, the workflow will try to replicate all missing changes to all repositories.
        required: false

permissions:
  contents: read

jobs:
  replicate:
    if: startsWith(github.repository, 'reshaprio/')
    name: Replicate governance docs and community-health workflows
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replicating files
        uses: derberg/manage-files-in-multiple-repositories@b64d9c8480606c15f957cdda078f0122815512b8 # v3.1.2
        with:
          github_token: ${{ secrets.BOT_GH_TOKEN }}
          patterns_to_include: .md,.github/workflows
          patterns_to_ignore: README.md,LICENSE,SUBPROJECTS.md,.github/workflows/global-replicator.yml
          exclude_private: true
          exclude_forked: true
          committer_username: reShapr-bot
          committer_email: info@reshapr.io
          commit_message: |
            chore: update from global .github repo

            Signed-off-by: reShapr-bot <info@reshapr.io>
